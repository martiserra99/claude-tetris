<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Aplica el tema guardado antes del primer pintado (evita el flash oscuro). game.js lo gestiona después.
    try { if (localStorage.getItem('tetris-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">☀️ Modo claro</button>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="records-combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-gameover" class="records-gameover hidden">
          <p id="records-message" class="records-message"></p>
          <div id="records-form" class="records-form hidden">
            <input id="records-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="records-save-btn" class="records-btn" type="button">Guardar</button>
          </div>
          <div id="records-table" class="records"></div>
          <button id="records-reset-btn" class="records-reset" type="button">Resetear récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <p class="start-subtitle">RÉCORDS</p>
        <div id="start-records" class="records"></div>
        <button id="start-btn" class="records-btn" type="button">Jugar</button>
        <button id="start-reset-btn" class="records-reset" type="button">Resetear récords</button>
        <p class="start-hint"><kbd>Enter</kbd> para jugar</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
